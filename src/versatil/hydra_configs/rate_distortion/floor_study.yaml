# @package _global_
# Extended tokenization-floor study on LIBERO (LeRobot). No model training.
# Reconstruction layer: FAST (scale, |V|) + per-value Binning across chunk horizons.
# G1 FAST scale sweep + G2 |V| sweep + G3 Binning sweep at H=10; G4 = each family's
# operating point across horizons {5,10,20,50}.
defaults:
  - /task/dataset_schema: libero_lerobot
  - /task/dataloader: libero_lerobot
  - /task/action_space: libero_precomputed_lerobot
  - /task/observation_space: libero_rgb_lerobot
  - /experiment: default
  - _self_

task:
  observation_horizon: 1
  prediction_horizon: 10

rate_distortion:
  _target_: versatil.analysis.rate_distortion.config.FastRateDistortionConfig
  scales: [2, 5, 10, 20, 50]
  vocab_sizes: [256, 512, 1024, 2048]
  scale_sweep_fixed_vocab: 1024
  vocab_sweep_fixed_scale: 10
  near_lossless_scale: 100
  near_lossless_vocab: 4096
  near_lossless_tolerance: 0.05
  max_chunks: 20000
  pretrained_fast_model: physical-intelligence/fast
  families: [fast, binning]
  bin_counts: [32, 64, 128, 256, 512, 1024]
  # uniform = the variant the trained policies and the replay study use;
  # quantile = data-adaptive edges, reported as the stronger reference baseline.
  binning_strategies: [uniform, quantile]
  horizons: [5, 10, 20, 50]
