# @package _global_
# QFAT on the synthetic multimodal benchmark (circle, num_modes=2).
# Autoregressive GPT + per-timestep Gaussian Mixture Model. SyntheticSchema
# auto-injects SyntheticRolloutCallback, which runs closed-/open-loop rollouts
# and logs mode coverage / success metrics every experiment.val_every epochs.
_target_: versatil.configs.main.MainConfig

defaults:
  - /task: base
  - /policy: base
  - /experiment: synthetic
  - /task/dataset_schema: synthetic/circle
  - /task/dataloader: synthetic_default
  - /task/action_space: synthetic_2d
  - /task/observation_space: synthetic_image_state
  - /training: synthetic
  - /policy/encoding_pipeline: mono_rgb
  - /policy/decoder: qfat
  - /policy/algorithm: behavioral_cloning
  - /policy/loss: gaussian_mixture_nll_synthetic
  - override /policy/decoder/heads@policy.decoder.action_heads: gaussian_synthetic_2d
  - _self_

task:
  observation_horizon: 1
  prediction_horizon: 60
  dataloader:
    val_ratio: 0.05
    action_sample_size: 2048

experiment:
  checkpoint_folder: ${checkpoint_dir:synthetic}
  save_checkpoints: true

training:
  optimizer:
    lr: 3.0e-4
    betas: [0.9, 0.95]
  lr_schedule: cosine
  lr_warmup_steps: 40

policy:
  metadata_passthrough:
    ${metadata_passthrough_source:OBSERVATION}:
      ${synthetic_obs_key:MODE_ID}: ${metadata_key:LATENT_COLOR_LABEL}
  _target_: versatil.models.policy.Policy
  observation_space: ${task.observation_space}
  action_space: ${task.action_space}
  prediction_horizon: ${task.prediction_horizon}
  observation_horizon: ${task.observation_horizon}
  device: ${experiment.device}
  encoding_pipeline:
    encoders:
      left:
        input_keys:
          - ${cameras:AGENTVIEW}
        backbone: ${rgb_backbone:MOBILENETV4_SMALL_050}
  decoder:
    input_keys:
      - left_rgb
    embedding_dimension: 256
    number_of_heads: 8
    number_of_key_value_heads: null
    feedforward_dimension: 512
    number_of_layers: 4
    dropout_rate: 0.2
    attention_dropout: 0.05
    activation: ${activation_function:RELU}
    normalization_type: ${normalization:RMS_NORM}
    attention_type: ${attention:MULTI_HEAD}
    positional_encoding_type: ${pos_encoding:ROPE}
    num_mixture_components: 4
    gmm_init_strategy: ${gmm_init:KMEANS_PLUS_PLUS}
    inference_sampling_mode: ${mixture_sampling:STOCHASTIC_MEAN}
    max_seq_len: 512
    min_logvar: -4.0
    max_logvar: 4.0
