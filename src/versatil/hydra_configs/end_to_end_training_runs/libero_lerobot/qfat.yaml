# @package _global_
# QFAT: Quantization-Free Action Transformer for Libero LeRobot.
# Autoregressive GPT + per-timestep Gaussian Mixture Model (continuous, no tokenization).
_target_: versatil.configs.main.MainConfig

defaults:
  - /task: base
  - /policy: base
  - /experiment: default
  - /task/dataset_schema: libero_lerobot
  - /task/dataloader: libero_lerobot
  - /task/action_space: libero_precomputed_lerobot
  - /task/observation_space: libero_rgb_lerobot
  - /training: default
  - /policy/encoding_pipeline: stereo_rgb_language_encoder
  - /policy/decoder: qfat
  - /policy/algorithm: bc
  - /policy/loss: gaussian_mixture_nll_gripper
  - override /policy/decoder/heads@policy.decoder.action_heads: gaussian_libero
  - _self_

task:
  observation_horizon: 1
  prediction_horizon: 1 # for libero pro the prediction horizon of qfat can only be 1
  dataloader:
    tokenization:
      observation_tokenizer:
        tokenizer_model: ${language_model:BERT_BASE}

experiment:
  precision: ${precision:FP32}
  checkpoint_folder: ${checkpoint_dir:libero}
  checkpoint_every: 5

training:
  num_epochs: 200
  early_stopping_patience: 100
  clip_gradient_norm: true
  clip_max_norm: 1.0
  optimizer:
    lr: 1.0e-4
    weight_decay: 1.0e-4

policy:
  _target_: versatil.models.policy.Policy
  observation_space: ${task.observation_space}
  action_space: ${task.action_space}
  prediction_horizon: ${task.prediction_horizon}
  observation_horizon: ${task.observation_horizon}
  device: ${experiment.device}
  encoding_pipeline:
    encoders:
      left:
        input_keys:
          - ${cameras:AGENTVIEW}
      right:
        input_keys:
          - ${cameras:EYE_IN_HAND}
      instruction:
        model_name: ${language_model:BERT_BASE}
  decoder:
    input_keys:
      - left_rgb
      - right_rgb
      - instruction_language
    embedding_dimension: 256
    number_of_heads: 8
    number_of_key_value_heads: 8
    number_of_layers: 4
    feedforward_dimension: 1024
    dropout_rate: 0.25
    attention_dropout: 0.1
    num_mixture_components: 4
    min_logvar: -4.0
