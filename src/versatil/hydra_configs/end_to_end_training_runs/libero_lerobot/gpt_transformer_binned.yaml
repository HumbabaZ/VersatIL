# @package _global_
# GPT-style autoregressive transformer trained from scratch on LIBERO (LeRobot),
# using per-value binned action tokenization (OpenVLA-style 256-bin uniform
# discretization) instead of FAST. Each action chunk is discretized into
# prediction_horizon * action_dim = 10 * 7 = 70 bin IDs plus an EOS token; the
# identity token-id mapping keeps the vocabulary compact at num_bins + 1.
_target_: versatil.configs.main.MainConfig

defaults:
  - /task: base
  - /policy: base
  - /experiment: default
  - /task/dataset_schema: libero_lerobot
  - /task/dataloader: libero_lerobot
  - /task/action_space: libero_precomputed_lerobot
  - /task/observation_space: libero_rgb_lerobot
  - /training: default
  - /policy/encoding_pipeline: stereo_rgb_language_encoder
  - /policy/decoder: gpt_action_transformer
  - /policy/algorithm: behavioral_cloning
  - /policy/loss: token_ce
  - override /task/dataloader/tokenization: obs_language_action_binned
  - _self_

task:
  observation_horizon: 1
  prediction_horizon: 10
  dataloader:
    tokenization:
      observation_tokenizer:
        tokenizer_model: ${language_model:BERT_BASE}

experiment:
  precision: ${precision:FP32}
  checkpoint_folder: ${checkpoint_dir:libero}
  checkpoint_every: 5

training:
  num_epochs: 300
  early_stopping_patience: 200
  lr_schedule: null
  clip_gradient_norm: true
  clip_max_norm: 1.0

policy:
  _target_: versatil.models.policy.Policy
  observation_space: ${task.observation_space}
  action_space: ${task.action_space}
  prediction_horizon: ${task.prediction_horizon}
  observation_horizon: ${task.observation_horizon}
  device: ${experiment.device}
  encoding_pipeline:
    encoders:
        left:
            input_keys:
              - ${cameras:AGENTVIEW}
        right:
            input_keys:
              - ${cameras:EYE_IN_HAND}
        instruction:
          model_name: ${language_model:BERT_BASE}
