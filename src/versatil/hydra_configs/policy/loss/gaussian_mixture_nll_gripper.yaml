defaults:
  - gaussian_mixture_nll@loss_modules.action_nll
  - gripper_mixture_nll@loss_modules.gripper_nll
  - _self_

_target_: versatil.metrics.losses.composite.CompositeLoss
loss_modules:
  action_nll:
    action_keys:
      - ${proprio_key:EE_POS_ACTION}
      - ${proprio_key:EE_ORI_ACTION}
    learned_variance: true
    weight: 1.0
  gripper_nll:
    key: ${proprio_key:GRIPPER_STATE_ACTION}
    actions_metadata: ${task.action_space.actions_metadata}
    learned_variance: true
    weight: 1.0
